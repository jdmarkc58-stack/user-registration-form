<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 35px auto;
    }

    .heading {
      text-align: center;
      margin-bottom: 22px;
    }

    .heading h1 {
      color: #1877f2;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .heading p {
      color: #606770;
      font-size: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .description {
      color: #606770;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 15px 0 7px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd0d5;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #1877f2;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #1877f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #7daef5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 13px;
      margin-top: 18px;
      border-radius: 7px;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      color: #b3261e;
    }

    .note {
      margin-top: 18px;
      color: #606770;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="heading">
      <h1>Registration</h1>
      <p>Create an account for this service</p>
    </header>

    <section class="card">

      <h2>Create account</h2>

      <p class="description">
        Complete the form below to continue.
      </p>

      <form id="registrationForm">

        <label for="fullName">Full name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="phone">Phone number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your phone number"
          autocomplete="tel"
          required
        >

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Create a new password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a new password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm new password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Enter the password again"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="registerButton">
          Register
        </button>

        <div id="message" role="status" aria-live="polite"></div>

      </form>

      <p class="note">
        This is a demonstration registration form.
        Do not enter passwords used for other accounts.
        Your information will not be saved or sent anywhere.
      </p>

    </section>

  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.className = "";
      message.style.display = "none";

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent =
          "Your passwords do not match. Please try again.";

        message.className = "error";
        return;
      }

      message.textContent =
        "The form has been completed successfully. This is only a demonstration: your registration has not been saved. A secure registration service is required to create your account.";

      message.className = "success";
    });
  </script>

</body>
          </html>
